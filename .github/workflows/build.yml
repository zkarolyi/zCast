name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the package to a GitHub release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build web/web.csproj -c Release

      - name: Publish Raspberry Pi package (linux-arm64)
        run: |
          dotnet publish web/web.csproj -c Release -r linux-arm64 --self-contained true -o out/zcast-linux-arm64/app
          cp deploy/install.sh deploy/zcast.service deploy/nginx-zcast.conf out/zcast-linux-arm64/
          chmod +x out/zcast-linux-arm64/install.sh out/zcast-linux-arm64/app/web
          tar -czf out/zcast-linux-arm64.tar.gz -C out zcast-linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: zcast-linux-arm64
          path: out/zcast-linux-arm64.tar.gz

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "zCast $GITHUB_REF_NAME" --notes "See [CHANGELOG.md](CHANGELOG.md)."
          gh release upload "$GITHUB_REF_NAME" out/zcast-linux-arm64.tar.gz --clobber
