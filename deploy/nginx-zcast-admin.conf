# zCast admin page: https://<server-ip>:8090/admin/
# Protection: home network only (zcast-allow.conf) + password (zcast-admin.htpasswd) + HTTPS
# (self-signed certificate created by install.sh). Never forward this port on the router.
# install.sh replaces 8090 if ZCAST_ADMIN_PORT is set.
server {
    listen 8090 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/zcast-admin/cert.pem;
    ssl_certificate_key /etc/nginx/zcast-admin/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Plain http:// on the HTTPS port: redirect to https:// instead of nginx's 400 page.
    error_page 497 =301 https://$host:$server_port$request_uri;

    include /etc/nginx/zcast-allow.conf;

    auth_basic           "zCast admin";
    auth_basic_user_file /etc/nginx/zcast-admin.htpasswd;

    client_max_body_size 1m;
    access_log /var/log/nginx/zcast-admin.access.log;
    error_log  /var/log/nginx/zcast-admin.error.log;

    location = / {
        return 302 /admin/;
    }

    location / {
        proxy_pass         http://127.0.0.1:8011;
        proxy_http_version 1.1;
        # Host with port: zCast compares it with the browser's Origin to block cross-site requests.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
