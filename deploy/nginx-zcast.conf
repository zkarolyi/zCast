# zCast virtual host for an existing nginx on port 80.
# The AVR resolves radioyamaha*.vtuner.com to this Pi (router DNS "Hosts" entries)
# and talks plain HTTP on port 80. Other server blocks are not affected,
# because nginx picks this block only for these exact host names.
server {
    listen 80;
    server_name radioyamaha.vtuner.com radioyamaha2.vtuner.com;

    # Home network only, even if port 80 is forwarded from the internet (see zcast-allow.conf).
    include /etc/nginx/zcast-allow.conf;

    access_log /var/log/nginx/zcast.access.log;
    error_log  /var/log/nginx/zcast.error.log;

    # The admin page is only served on its own site (nginx-zcast-admin.conf).
    location /admin {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        # zCast builds its menu URLs from the Host header, so it must be passed through.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
